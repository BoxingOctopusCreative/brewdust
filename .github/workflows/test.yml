name: Test

on:
  pull_request:
  workflow_call: # the release workflow runs these before releasing

permissions:
  contents: read

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # brewdust targets macOS, and Homebrew on Linux too (see atime_linux.go).
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check license notices
        run: |
          missing=$(git ls-files '*.go' '*.sh' | xargs grep -L 'subject to the terms of the Mozilla Public' || true)
          if [ -n "$missing" ]; then
            echo "These files need the MPL 2.0 notice at the top (copy it from any other file):"
            echo "$missing"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
