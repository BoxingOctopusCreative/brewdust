name: Release

# Every pull request merged into main is released. Its label picks the
# version bump: release:major, release:minor or release:patch (the default
# when there's none), or release:none to skip releasing it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# Releases go out one at a time, in merge order, so versions never collide.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # for the tags

      - name: Choose the version bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF"
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "bump=$INPUT_BUMP" >> "$GITHUB_OUTPUT"
            echo "Manual release: $INPUT_BUMP" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The pull request this push merged, if any.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
          if [ -z "$pr" ]; then
            echo "::notice::$GITHUB_SHA wasn't merged from a pull request; not releasing. Run this workflow by hand to release it."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          if ! bump=$(jq -r '.labels[].name' <<<"$pr" | scripts/release/bump-from-labels.sh 2>&1); then
            echo "::error::#$number: $bump"
            exit 1
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Merged #$number, so the bump is **$bump**" >> "$GITHUB_STEP_SUMMARY"

      - name: Work out the version
        id: version
        if: steps.bump.outputs.bump != 'none'
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          version=$(scripts/release/next-version.sh "$latest" "$BUMP")
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${latest:-no previous release} → **$version**" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: plan
    if: needs.plan.outputs.bump != 'none'
    uses: ./.github/workflows/test.yml

  release:
    name: Build and publish ${{ needs.plan.outputs.version }}
    needs: [plan, test]
    runs-on: macos-latest # codesign and notarytool only run on macOS
    permissions:
      contents: write # to create the tag and release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Import the signing certificate and notary key
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_KEY_P8; do
            if [ -z "${!secret}" ]; then
              echo "::error::Secret for $secret is not set; see Releases → Signing in the README"
              exit 1
            fi
          done

          # A throwaway keychain holding only the Developer ID certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$CERTIFICATE_P12" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

          base64 --decode <<<"$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          REQUIRE_SIGNING: 1
          SIGN_IDENTITY: "${{ vars.SIGN_IDENTITY || 'Developer ID Application: Ryan Draga (QA32Z4XU99)' }}"
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release/build.sh "${{ needs.plan.outputs.version }}" dist

      - name: Remove the signing keychain and notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

  tap:
    name: Update the Homebrew formula
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP: ${{ vars.HOMEBREW_TAP || 'boxingoctopus/homebrew-taptastic' }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::The TAP_TOKEN secret isn't set, so $TAP wasn't updated to $VERSION; see Releases → Homebrew in the README"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.set == 'true'

      - uses: actions/checkout@v5
        if: steps.token.outputs.set == 'true'
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write and push the formula
        if: steps.token.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checksums of the archives as published, not as built.
          gh release download "$VERSION" --pattern checksums.txt --dir "$RUNNER_TEMP"
          scripts/release/formula.sh "$VERSION" "$RUNNER_TEMP/checksums.txt" > tap/brewdust.rb

          cd tap
          git add brewdust.rb
          if git diff --cached --quiet; then
            echo "brewdust.rb is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "brewdust $VERSION"
          git push
          echo "Updated [$TAP](https://github.com/$TAP) to brewdust $VERSION" >> "$GITHUB_STEP_SUMMARY"
